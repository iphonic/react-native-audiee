name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: C++ Audio Engine & DSP Tests (macOS & Ubuntu Linux)
  test-cpp:
    name: C++ Engine Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compile and Run C++ Unit Tests
        run: |
          npm run test:cpp

  # Job 2: TypeScript Compilation & Typecheck
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install --package-lock-only
          npm install typescript @types/react @types/react-native --no-save

      - name: Run TypeScript Compiler Check
        run: |
          npx tsc --noEmit --skipLibCheck
